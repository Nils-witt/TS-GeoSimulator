name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Install scripts are skipped: native modules (sqlite3) are not needed to lint or type-check
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run ESLint
        id: eslint
        continue-on-error: true
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: npx eslint .
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif

      # Forks and Dependabot PRs get a read-only token and cannot upload code scanning results
      - name: Upload analysis results to GitHub
        if: always() && hashFiles('eslint-results.sarif') != '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Fail on ESLint errors
        if: steps.eslint.outcome == 'failure'
        run: |
          echo "::error::ESLint reported errors, see the Code scanning results."
          exit 1
