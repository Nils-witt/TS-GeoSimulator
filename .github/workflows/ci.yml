name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Format, lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Install scripts are skipped: native modules (sqlite3) are not needed to lint or type-check
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Check formatting
        id: format
        continue-on-error: true
        run: npx prettier --check .

      - name: Run oxlint
        id: lint
        continue-on-error: true
        run: npx oxlint --format sarif > oxlint-results.sarif

      # Forks and Dependabot PRs get a read-only token and cannot upload code scanning results
      - name: Upload analysis results to GitHub
        if: always() && hashFiles('oxlint-results.sarif') != '' && github.event.pull_request.head.repo.fork != true && github.actor != 'dependabot[bot]'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: oxlint-results.sarif
          wait-for-processing: true

      - name: Type-check
        run: npx tsc --noEmit

      - name: Fail on formatting issues
        if: steps.format.outcome == 'failure'
        run: |
          echo "::error::Files are not formatted with Prettier. Run 'npm run format' locally."
          exit 1

      - name: Fail on lint errors
        if: steps.lint.outcome == 'failure'
        run: npx oxlint --format github
