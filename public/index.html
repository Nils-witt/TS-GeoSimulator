<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GeoSimulator</title>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <style>
            :root {
                --bg: #f6f7f9;
                --panel: #ffffff;
                --border: #e2e5ea;
                --text: #1c2028;
                --muted: #6b7280;
                --accent: #2563eb;
                --hover: #f1f4f9;
                --selected: #e8effd;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #111418;
                    --panel: #1a1e24;
                    --border: #2b313a;
                    --text: #e6e9ee;
                    --muted: #8b93a1;
                    --accent: #60a5fa;
                    --hover: #222831;
                    --selected: #1e2a3d;
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                font:
                    14px/1.4 system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                color: var(--text);
                background: var(--bg);
            }
            .app {
                display: grid;
                grid-template-columns: 380px 1fr;
                height: 100%;
            }
            aside {
                display: flex;
                flex-direction: column;
                min-height: 0;
                background: var(--panel);
                border-right: 1px solid var(--border);
            }
            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 16px;
                border-bottom: 1px solid var(--border);
            }
            header h1 {
                margin: 0;
                font-size: 16px;
            }
            .conn {
                font-size: 12px;
                color: var(--muted);
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #9ca3af;
            }
            .conn.live .dot {
                background: #16a34a;
            }
            .conn.down .dot {
                background: #dc2626;
            }
            .section-title {
                padding: 10px 16px 4px;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--muted);
            }
            #vehicles {
                list-style: none;
                margin: 0;
                padding: 0 8px 8px;
                overflow: auto;
                max-height: 40%;
                flex-shrink: 0;
            }
            #vehicles li {
                display: flex;
                gap: 10px;
                align-items: center;
                padding: 8px;
                border-radius: 6px;
                cursor: pointer;
            }
            #vehicles li:hover {
                background: var(--hover);
            }
            #vehicles li.selected {
                background: var(--selected);
            }
            .v-name {
                font-weight: 600;
            }
            .v-sub {
                font-size: 12px;
                color: var(--muted);
            }
            .badge {
                flex-shrink: 0;
                min-width: 26px;
                height: 26px;
                border-radius: 6px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-weight: 700;
                color: #fff;
            }
            #detail {
                flex: 1;
                min-height: 0;
                overflow: auto;
                border-top: 1px solid var(--border);
            }
            .empty {
                padding: 16px;
                color: var(--muted);
            }
            dl {
                display: grid;
                grid-template-columns: auto 1fr;
                gap: 4px 12px;
                margin: 0;
                padding: 4px 16px 8px;
            }
            dt {
                color: var(--muted);
            }
            dd {
                margin: 0;
                font-variant-numeric: tabular-nums;
                word-break: break-all;
            }
            .tabs {
                display: flex;
                gap: 4px;
                padding: 8px 16px 0;
                border-bottom: 1px solid var(--border);
            }
            .views button,
            .tabs button {
                border: 0;
                background: none;
                color: var(--muted);
                padding: 6px 10px;
                cursor: pointer;
                border-bottom: 2px solid transparent;
                font: inherit;
            }
            .tabs button.active {
                color: var(--text);
                border-bottom-color: var(--accent);
            }
            table {
                width: 100%;
                border-collapse: collapse;
                font-variant-numeric: tabular-nums;
            }
            th,
            td {
                text-align: left;
                padding: 6px 16px;
                border-bottom: 1px solid var(--border);
            }
            th {
                font-size: 12px;
                font-weight: 600;
                color: var(--muted);
            }
            tr.clickable {
                cursor: pointer;
            }
            tr.clickable:hover {
                background: var(--hover);
            }
            tr.active {
                background: var(--selected);
            }
            .toolbar {
                display: flex;
                gap: 12px;
                padding: 8px 16px;
                font-size: 13px;
            }
            [hidden] {
                display: none !important;
            }
            .views {
                display: flex;
                gap: 4px;
                padding: 4px 12px 0;
                border-bottom: 1px solid var(--border);
            }
            .views button.active {
                color: var(--text);
                border-bottom-color: var(--accent);
            }
            .view {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-height: 0;
            }
            #config-form {
                flex: 1;
                overflow: auto;
                padding: 0 12px 12px;
            }
            .card {
                display: flex;
                flex-direction: column;
                gap: 8px;
                margin: 8px 0;
                padding: 10px;
                border: 1px solid var(--border);
                border-left: 4px solid var(--card-color, var(--border));
                border-radius: 8px;
            }
            .card.disabled {
                opacity: 0.6;
            }
            .row {
                display: flex;
                gap: 8px;
                align-items: flex-end;
            }
            .field {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
                font-size: 12px;
                color: var(--muted);
            }
            .field.grow {
                flex: 1;
            }
            input,
            select {
                width: 100%;
                min-width: 0;
                padding: 5px 7px;
                font: inherit;
                font-size: 13px;
                color: var(--text);
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
            }
            input:focus,
            select:focus {
                outline: 2px solid var(--accent);
                outline-offset: -1px;
            }
            input[type='checkbox'] {
                width: auto;
            }
            .coord {
                display: grid;
                grid-template-columns: 92px 1fr 1fr auto;
                gap: 6px;
                align-items: center;
                font-size: 12px;
                color: var(--muted);
            }
            .checks {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 12px;
                font-size: 13px;
                color: var(--text);
            }
            .btn,
            button.icon {
                font: inherit;
                color: var(--text);
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 6px;
                cursor: pointer;
            }
            .btn {
                padding: 6px 12px;
            }
            button.icon {
                flex-shrink: 0;
                width: 30px;
                height: 30px;
            }
            button.icon.active,
            .btn.primary {
                color: #fff;
                background: var(--accent);
                border-color: var(--accent);
            }
            .btn.add {
                width: 100%;
                border-style: dashed;
                color: var(--muted);
            }
            .btn:disabled {
                opacity: 0.5;
                cursor: default;
            }
            .config-footer {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px 12px;
                border-top: 1px solid var(--border);
            }
            .config-footer .actions {
                display: flex;
                gap: 8px;
                align-items: center;
            }
            #config-state {
                flex: 1;
                font-size: 12px;
                color: var(--muted);
            }
            .card-actions {
                display: flex;
                gap: 8px;
                align-items: center;
                font-size: 12px;
                color: var(--muted);
            }
            .card-actions span {
                flex: 1;
            }
            .card-footer:empty {
                display: none;
            }
            #config-errors ul,
            ul.card-errors {
                margin: 0;
                padding-left: 18px;
                max-height: 120px;
                overflow: auto;
                font-size: 12px;
                color: #dc2626;
            }
            #map.picking,
            #map.picking * {
                cursor: crosshair !important;
            }
            #map {
                height: 100%;
            }
            @media (max-width: 760px) {
                .app {
                    grid-template-columns: 1fr;
                    grid-template-rows: 45vh 1fr;
                }
                aside {
                    order: 2;
                    border-right: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="app">
            <aside>
                <header>
                    <h1>GeoSimulator</h1>
                    <span class="conn" id="conn"><span class="dot"></span><span id="conn-text">connecting…</span></span>
                </header>
                <nav class="views">
                    <button data-view="live" class="active">Live</button>
                    <button data-view="config">Config</button>
                </nav>
                <div id="live-view" class="view">
                    <div class="section-title">Vehicles</div>
                    <ul id="vehicles"></ul>
                    <div id="detail"><div class="empty">Select a vehicle to see its route and history.</div></div>
                </div>
                <div id="config-view" class="view" hidden>
                    <div id="config-form"><div class="empty">Loading…</div></div>
                    <div class="config-footer">
                        <div id="config-errors"></div>
                        <div class="actions">
                            <span id="config-state"></span>
                            <button class="btn" id="config-discard" disabled>Discard all changes</button>
                        </div>
                    </div>
                </div>
            </aside>
            <div id="map"></div>
        </div>

        <script>
            const STATUS = {
                1: {label: 'Available (radio)', color: '#16a34a'},
                2: {label: 'Available (station)', color: '#15803d'},
                3: {label: 'Responding', color: '#ea580c'},
                4: {label: 'On scene', color: '#dc2626'},
                5: {label: 'Request to talk', color: '#ca8a04'},
                6: {label: 'Not available', color: '#6b7280'},
                7: {label: 'Patient loaded', color: '#9333ea'},
                8: {label: 'At destination', color: '#7c3aed'},
            };
            const statusInfo = (s) => STATUS[s] ?? {label: s == null ? 'Unknown' : `Status ${s}`, color: '#6b7280'};

            const vehicles = new Map(); // id -> summary
            const layers = new Map(); // id -> {marker, route}
            let selectedId = null;
            let history = null; // history of selected vehicle
            let activeTab = 'status';
            let shownRouteIndex = null; // index into history.routes, null = current route
            let showTrail = true;
            let fitted = false;

            const map = L.map('map').setView([50.7374, 7.0982], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors',
            }).addTo(map);
            const trailLayer = L.polyline([], {color: '#2563eb', weight: 3, opacity: 0.6, dashArray: '4 6'}).addTo(map);
            const historicRouteLayer = L.polyline([], {color: '#a855f7', weight: 5, opacity: 0.8}).addTo(map);

            const $ = (id) => document.getElementById(id);
            const esc = (s) =>
                String(s).replace(
                    /[&<>"']/g,
                    (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c],
                );
            const toLatLngs = (route) => (route || []).map((p) => [p.latitude, p.longitude]);
            const fmtTime = (ts) => new Date(ts).toLocaleTimeString();
            const fmtDateTime = (ts) => new Date(ts).toLocaleString();
            const fmtCoord = (p) => (p ? `${p.latitude.toFixed(5)}, ${p.longitude.toFixed(5)}` : '—');
            const fmtDuration = (ms) => {
                const s = Math.round(ms / 1000);
                if (s < 60) return `${s}s`;
                const m = Math.floor(s / 60);
                if (m < 60) return `${m}m ${s % 60}s`;
                return `${Math.floor(m / 60)}h ${m % 60}m`;
            };
            const fmtDistance = (m) => (m >= 1000 ? `${(m / 1000).toFixed(2)} km` : `${Math.round(m)} m`);
            function routeLength(route) {
                let total = 0;
                for (let i = 1; i < route.length; i++) {
                    total += map.distance(
                        [route[i - 1].latitude, route[i - 1].longitude],
                        [route[i].latitude, route[i].longitude],
                    );
                }
                return total;
            }

            // --- Map ---

            function updateLayers(v) {
                let l = layers.get(v.id);
                if (!l) {
                    l = {
                        marker: L.circleMarker([0, 0], {radius: 9, weight: 2, color: '#fff', fillOpacity: 1}),
                        route: L.polyline([], {weight: 3, opacity: 0.5}).addTo(map),
                    };
                    l.marker.bindTooltip('', {direction: 'top', offset: [0, -8]});
                    l.marker.on('click', () => select(v.id));
                    l.route.on('click', () => select(v.id));
                    layers.set(v.id, l);
                }
                const info = statusInfo(v.status);
                const selected = v.id === selectedId;
                if (v.position) {
                    l.marker.setLatLng([v.position.latitude, v.position.longitude]).addTo(map);
                } else {
                    l.marker.remove();
                }
                l.marker.setStyle({fillColor: info.color, radius: selected ? 11 : 9});
                l.marker.setTooltipContent(`<b>${esc(v.name)}</b><br>${v.status ?? '?'} · ${esc(info.label)}`);
                l.route.setLatLngs(toLatLngs(v.route));
                l.route.setStyle({color: info.color, weight: selected ? 5 : 3, opacity: selected ? 0.9 : 0.45});
                if (selected) {
                    l.route.bringToFront();
                    l.marker.bringToFront();
                }
            }

            function fitAll() {
                const bounds = L.latLngBounds([]);
                for (const v of vehicles.values()) {
                    if (v.position) bounds.extend([v.position.latitude, v.position.longitude]);
                    for (const p of v.route || []) bounds.extend([p.latitude, p.longitude]);
                }
                if (bounds.isValid()) {
                    map.fitBounds(bounds, {padding: [40, 40], maxZoom: 15});
                    fitted = true;
                }
            }

            function updateOverlays() {
                const trail = showTrail && history ? history.positions.filter((p) => p.latitude != null) : [];
                trailLayer.setLatLngs(toLatLngs(trail));
                const hist = history && shownRouteIndex != null ? history.routes[shownRouteIndex] : null;
                historicRouteLayer.setLatLngs(hist ? toLatLngs(hist.route) : []);
                if (hist) historicRouteLayer.bringToFront();
            }

            // --- Sidebar ---

            function renderList() {
                const list = $('vehicles');
                const sorted = [...vehicles.values()].sort((a, b) => a.name.localeCompare(b.name));
                if (sorted.length === 0) {
                    list.innerHTML = '<li class="empty">No vehicles running.</li>';
                    return;
                }
                list.innerHTML = sorted
                    .map((v) => {
                        const info = statusInfo(v.status);
                        return `<li data-id="${esc(v.id)}" class="${v.id === selectedId ? 'selected' : ''}">
                            <span class="badge" style="background:${info.color}" title="${esc(info.label)}">${v.status ?? '?'}</span>
                            <span>
                                <div class="v-name">${esc(v.name)}</div>
                                <div class="v-sub">${esc(info.label)} · ${esc(v.simulator ?? '')}</div>
                            </span>
                        </li>`;
                    })
                    .join('');
            }
            $('vehicles').addEventListener('click', (e) => {
                const li = e.target.closest('li[data-id]');
                if (li) select(li.dataset.id);
            });

            function renderDetail() {
                const v = vehicles.get(selectedId);
                const el = $('detail');
                if (!v) {
                    el.innerHTML = '<div class="empty">Select a vehicle to see its route and history.</div>';
                    return;
                }
                const info = statusInfo(v.status);
                const remaining = v.route && v.route.length ? fmtDistance(routeLength(v.route)) : '—';
                let body = '';
                if (!history) {
                    body = '<div class="empty">Loading history…</div>';
                } else if (activeTab === 'status') {
                    const rows = [...history.statuses].reverse();
                    body = rows.length
                        ? `<table><tr><th>Time</th><th>Status</th><th>Duration</th></tr>${rows
                              .map((s, i) => {
                                  const end = i === 0 ? Date.now() : rows[i - 1].timestamp;
                                  const si = statusInfo(s.status);
                                  return `<tr><td>${fmtTime(s.timestamp)}</td>
                                    <td><span class="badge" style="background:${si.color};height:20px;min-width:20px;font-size:12px">${s.status}</span> ${esc(si.label)}</td>
                                    <td>${fmtDuration(end - s.timestamp)}</td></tr>`;
                              })
                              .join('')}</table>`
                        : '<div class="empty">No status changes recorded yet.</div>';
                } else if (activeTab === 'routes') {
                    const rows = history.routes.map((r, i) => ({r, i})).reverse();
                    body = rows.length
                        ? `<div class="toolbar">Click a route to highlight it on the map.</div>
                           <table><tr><th>Started</th><th>Points</th><th>Length</th></tr>${rows
                               .map(
                                   ({
                                       r,
                                       i,
                                   }) => `<tr class="clickable ${i === shownRouteIndex ? 'active' : ''}" data-route="${i}">
                                    <td>${fmtTime(r.timestamp)}</td><td>${r.route.length}</td><td>${fmtDistance(routeLength(r.route))}</td></tr>`,
                               )
                               .join('')}</table>`
                        : '<div class="empty">No routes recorded yet.</div>';
                } else {
                    const rows = history.positions.slice(-200).reverse();
                    body = `<div class="toolbar"><label><input type="checkbox" id="trail" ${showTrail ? 'checked' : ''}> Show trail on map</label>
                            <span style="color:var(--muted)">${history.positions.length} points</span></div>
                        <table><tr><th>Time</th><th>Position</th></tr>${rows
                            .map(
                                (p) =>
                                    `<tr><td>${fmtTime(p.timestamp)}</td><td>${p.latitude == null ? '—' : fmtCoord(p)}</td></tr>`,
                            )
                            .join('')}</table>`;
                }
                el.innerHTML = `
                    <div class="section-title">Details</div>
                    <dl>
                        <dt>Name</dt><dd>${esc(v.name)}</dd>
                        <dt>ID</dt><dd>${esc(v.id)}</dd>
                        <dt>Simulator</dt><dd>${esc(v.simulator ?? '—')}</dd>
                        <dt>Status</dt><dd>${v.status ?? '?'} · ${esc(info.label)}</dd>
                        <dt>Position</dt><dd>${fmtCoord(v.position)}</dd>
                        <dt>Route</dt><dd>${v.route?.length ?? 0} points · ${remaining}</dd>
                        <dt>Updated</dt><dd>${fmtDateTime(v.updatedAt)}</dd>
                    </dl>
                    <div class="toolbar">
                        <button class="btn" data-action="clear-history" ${history ? '' : 'disabled'}>Clear history</button>
                    </div>
                    <div class="tabs">
                        ${['status', 'routes', 'positions']
                            .map(
                                (t) =>
                                    `<button data-tab="${t}" class="${t === activeTab ? 'active' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`,
                            )
                            .join('')}
                    </div>
                    ${body}`;
            }
            $('detail').addEventListener('click', (e) => {
                const tab = e.target.closest('button[data-tab]');
                if (tab) {
                    activeTab = tab.dataset.tab;
                    renderDetail();
                    return;
                }
                if (e.target.closest('button[data-action="clear-history"]')) {
                    clearHistory(selectedId);
                    return;
                }
                const row = e.target.closest('tr[data-route]');
                if (row) {
                    const i = Number(row.dataset.route);
                    shownRouteIndex = shownRouteIndex === i ? null : i;
                    updateOverlays();
                    if (shownRouteIndex != null) map.fitBounds(historicRouteLayer.getBounds(), {padding: [40, 40]});
                    renderDetail();
                }
            });
            $('detail').addEventListener('change', (e) => {
                if (e.target.id === 'trail') {
                    showTrail = e.target.checked;
                    updateOverlays();
                }
            });

            // --- Data ---

            async function select(id) {
                if (pickTarget) return;
                const previous = selectedId;
                selectedId = id;
                history = null;
                shownRouteIndex = null;
                for (const pid of [previous, id]) if (vehicles.has(pid)) updateLayers(vehicles.get(pid));
                renderList();
                renderDetail();
                updateOverlays();
                const v = vehicles.get(id);
                if (v?.position) map.panTo([v.position.latitude, v.position.longitude]);
                const res = await fetch(`api/vehicles/${encodeURIComponent(id)}/history`);
                if (selectedId !== id || !res.ok) return;
                history = await res.json();
                renderDetail();
                updateOverlays();
            }

            async function clearHistory(id) {
                const v = vehicles.get(id);
                if (!v || !confirm(`Delete all stored positions, status changes and routes of "${v.name}"?`)) return;
                const res = await fetch(`api/vehicles/${encodeURIComponent(id)}/history`, {method: 'DELETE'}).catch(
                    () => null,
                );
                if (!res?.ok) {
                    alert('Could not clear the history.');
                    return;
                }
                if (selectedId !== id) return;
                history = {positions: [], statuses: [], routes: []};
                shownRouteIndex = null;
                renderDetail();
                updateOverlays();
            }

            async function loadVehicles() {
                const res = await fetch('api/vehicles');
                const list = await res.json();
                vehicles.clear();
                for (const v of list) {
                    vehicles.set(v.id, v);
                    updateLayers(v);
                }
                // Vehicles can disappear when the config changes.
                for (const [id, l] of layers) {
                    if (vehicles.has(id)) continue;
                    l.marker.remove();
                    l.route.remove();
                    layers.delete(id);
                }
                if (selectedId && !vehicles.has(selectedId)) {
                    selectedId = null;
                    history = null;
                    shownRouteIndex = null;
                    updateOverlays();
                }
                renderList();
                renderDetail();
                if (!fitted) fitAll();
            }

            let detailTimer = null;
            function scheduleDetailRender() {
                // Position events arrive every few seconds per vehicle; batch detail re-renders.
                if (detailTimer) return;
                detailTimer = setTimeout(() => {
                    detailTimer = null;
                    renderDetail();
                }, 500);
            }

            function applyEvent(type, data) {
                const v = vehicles.get(data.id);
                if (!v) {
                    loadVehicles();
                    return;
                }
                const selected = data.id === selectedId;
                if (type === 'position') {
                    v.position = data.latitude == null ? null : {latitude: data.latitude, longitude: data.longitude};
                    if (selected && history) history.positions.push(data);
                } else if (type === 'status') {
                    v.status = data.status;
                    if (selected && history) history.statuses.push(data);
                    renderList();
                } else if (type === 'route') {
                    v.route = data.route;
                    if (selected && history) history.routes.push({route: data.route, timestamp: data.timestamp});
                }
                v.updatedAt = data.timestamp;
                updateLayers(v);
                if (selected) {
                    if (type === 'position') {
                        if (showTrail && data.latitude != null) trailLayer.addLatLng([data.latitude, data.longitude]);
                        scheduleDetailRender();
                    } else {
                        renderDetail();
                    }
                }
            }

            let reconnectDelay = 1000;
            function connect() {
                // Resolved relative to the page, like the api/... fetches.
                const url = new URL('api/ws', location.href);
                url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                const ws = new WebSocket(url);
                ws.onopen = () => {
                    reconnectDelay = 1000;
                    $('conn').className = 'conn live';
                    $('conn-text').textContent = 'live';
                    loadVehicles().then(() => selectedId && select(selectedId));
                };
                ws.onclose = () => {
                    $('conn').className = 'conn down';
                    $('conn-text').textContent = 'reconnecting…';
                    setTimeout(connect, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 2, 15000);
                };
                ws.onmessage = (e) => {
                    const {type, data} = JSON.parse(e.data);
                    if (type === 'reload') {
                        loadVehicles();
                        // Pick up changes made in another tab; cards with local edits are kept.
                        if (draft && !saving)
                            refreshConfig().then(() => {
                                renderConfig();
                                updateConfigState();
                            });
                    } else {
                        applyEvent(type, data);
                    }
                };
            }

            // --- Config ---

            const COORD_LABELS = {
                start: 'Start',
                end: 'Destination',
                corner1: 'Area corner 1',
                corner2: 'Area corner 2',
                homeLocation: 'Home station',
            };
            const FIELD_LABELS = {url: 'URL', token: 'Token', databasePath: 'Database file'};
            const MOVEMENT_TYPES = ['driving', 'walking', 'cycling'];
            const CARD_COLORS = [
                '#2563eb',
                '#db2777',
                '#0891b2',
                '#65a30d',
                '#d97706',
                '#7c3aed',
                '#dc2626',
                '#0d9488',
            ];
            const cardColor = (i) => CARD_COLORS[i % CARD_COLORS.length];

            let view = 'live';
            let configMeta = null; // {connectorTypes, simulatorTypes}: required fields per type
            // Every connector and vehicle card is saved on its own (POST/PUT/DELETE, see ENDPOINT).
            const KINDS = ['connectors', 'vehicles'];
            const KEY = {connectors: 'id', vehicles: 'id'};
            const LABEL = {connectors: 'connector', vehicles: 'vehicle'};
            let saved = null; // config as stored on the server
            let draft = null; // edited copy of `saved`
            const storedKeys = new WeakMap(); // draft item -> ID it is stored under; missing: not saved yet
            const itemErrors = new WeakMap(); // draft item -> errors of its last save
            let saving = false;
            let pickTarget = null; // {index, field}
            const configLayer = L.layerGroup();

            const round = (n) => Math.round(n * 1e6) / 1e6;
            const isPos = (p) => p && Number.isFinite(p.latitude) && Number.isFinite(p.longitude);
            function setPath(obj, path, value) {
                const keys = path.split('.');
                let target = obj;
                for (const key of keys.slice(0, -1)) {
                    if (target[key] == null || typeof target[key] !== 'object') target[key] = {};
                    target = target[key];
                }
                if (value === undefined) delete target[keys.at(-1)];
                else target[keys.at(-1)] = value;
            }

            // JSON with sorted keys, so that edits which only change the key order do not count as changes.
            const canonical = (value) =>
                JSON.stringify(value, (_k, v) =>
                    v && typeof v === 'object' && !Array.isArray(v)
                        ? Object.fromEntries(Object.entries(v).sort(([a], [b]) => a.localeCompare(b)))
                        : v,
                );
            function savedItem(kind, item) {
                const key = storedKeys.get(item);
                return key == null ? undefined : saved[kind].find((s) => s[KEY[kind]] === key);
            }
            function isChanged(kind, item) {
                const stored = savedItem(kind, item);
                return !stored || canonical(stored) !== canonical(item);
            }
            const unsavedCount = () =>
                draft ? KINDS.reduce((n, kind) => n + draft[kind].filter((i) => isChanged(kind, i)).length, 0) : 0;

            function updateConfigState(message) {
                const unsaved = unsavedCount();
                $('config-state').textContent =
                    message ??
                    (saving
                        ? 'Applying…'
                        : pickTarget
                          ? 'Click on the map to set the position (Esc cancels).'
                          : unsaved
                            ? `${unsaved} unsaved ${unsaved === 1 ? 'card' : 'cards'}`
                            : '');
                $('config-discard').disabled = saving || !unsaved;
            }
            const errorList = (errors, cls = '') =>
                errors.length ? `<ul class="${cls}">${errors.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>` : '';
            function showConfigErrors(errors) {
                $('config-errors').innerHTML = errorList(errors);
            }

            /**
             * Fetches the stored connectors and vehicles plus the required fields per type.
             * Returns null (after showing an error) if anything cannot be loaded.
             */
            async function fetchStored() {
                const results = await Promise.all(
                    ['api/connectors', 'api/connectors/types', 'api/vehicles/configs', 'api/vehicles/types'].map((url) =>
                        fetch(url)
                            .then((res) => (res.ok ? res.json() : null))
                            .catch(() => null),
                    ),
                );
                if (results.includes(null)) {
                    showConfigErrors(['Could not load the config.']);
                    return null;
                }
                const [connectors, connectorTypes, vehicles, simulatorTypes] = results;
                return {meta: {connectorTypes, simulatorTypes}, config: {connectors, vehicles}};
            }

            /** Replaces all local edits with the stored config. */
            async function loadConfig() {
                const stored = await fetchStored();
                if (!stored) return;
                configMeta = stored.meta;
                saved = stored.config;
                draft = {connectors: [], vehicles: []};
                for (const kind of KINDS) {
                    for (const stored of saved[kind]) {
                        const item = structuredClone(stored);
                        storedKeys.set(item, stored[KEY[kind]]);
                        draft[kind].push(item);
                    }
                }
                renderConfig();
                updateConfigState();
            }

            /**
             * Picks up the stored config but keeps cards with unsaved edits, except `clean` (the card that was just
             * saved). Edited cards that were deleted on the server become unsaved new cards.
             */
            async function refreshConfig(clean) {
                const stored = await fetchStored();
                if (!stored) return;
                const fresh = stored.config;
                const next = {connectors: [], vehicles: []};
                for (const kind of KINDS) {
                    const edited = draft[kind].filter((i) => i !== clean && isChanged(kind, i));
                    const kept = new Set();
                    for (const stored of fresh[kind]) {
                        const key = stored[KEY[kind]];
                        const local = edited.find((i) => storedKeys.get(i) === key);
                        const item = local ?? structuredClone(stored);
                        storedKeys.set(item, key);
                        kept.add(item);
                        next[kind].push(item);
                    }
                    for (const item of edited) {
                        if (kept.has(item)) continue;
                        storedKeys.delete(item);
                        next[kind].push(item);
                    }
                }
                saved = fresh;
                draft = next;
                cancelPick();
            }

            /** Removes a deleted connector from the vehicle cards, like the server does. */
            function removeConnectorReferences(id) {
                for (const v of draft.vehicles) v.connectors = v.connectors.filter((c) => c !== id);
            }

            const ENDPOINT = {connectors: 'api/connectors', vehicles: 'api/vehicles'};

            /** Sends one change; `key` is the stored ID of the item (omitted for POST). */
            async function sendConfig(method, kind, key, body) {
                const url = key == null ? ENDPOINT[kind] : `${ENDPOINT[kind]}/${encodeURIComponent(key)}`;
                const res = await fetch(url, {
                    method,
                    headers: body ? {'Content-Type': 'application/json'} : {},
                    body: body ? JSON.stringify(body) : undefined,
                });
                const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
                // The card already says which item it is, so drop the "Connector:"/"Vehicle:" prefix.
                const errors = res.ok
                    ? []
                    : (data.details ?? data.errors ?? [data.error ?? `Request failed (${res.status})`]).map((e) =>
                          e.replace(/^(Connector|Vehicle)( \d+)?: /, ''),
                      );
                return {stored: res.ok, errors, entity: res.ok ? data : undefined};
            }

            /** Runs one change against the server, then shows its errors on `item` and picks up the stored config. */
            async function applyChange(item, change) {
                cancelPick();
                saving = true;
                itemErrors.delete(item);
                showConfigErrors([]);
                renderConfig();
                updateConfigState();
                let result;
                try {
                    result = await change();
                } catch (err) {
                    result = {stored: false, errors: [`Could not reach the simulator: ${err.message}`]};
                }
                if (result.stored) await refreshConfig(item);
                saving = false;
                if (result.errors.length) {
                    if (KINDS.some((k) => draft[k].includes(item))) itemErrors.set(item, result.errors);
                    else showConfigErrors(result.errors);
                }
                renderConfig();
                updateConfigState(result.stored && !result.errors.length ? 'Saved and applied.' : undefined);
            }

            function saveItem(kind, item) {
                const key = storedKeys.get(item);
                return applyChange(item, async () => {
                    const result =
                        key == null
                            ? await sendConfig('POST', kind, null, item)
                            : await sendConfig('PUT', kind, key, item);
                    // New items get their UUID from the server unless one was entered.
                    if (result.stored) storedKeys.set(item, result.entity?.id ?? item.id);
                    return result;
                });
            }

            function deleteItem(kind, item) {
                const key = storedKeys.get(item);
                const remove = () => draft[kind].splice(draft[kind].indexOf(item), 1);
                if (key == null) {
                    remove();
                    renderConfig();
                    updateConfigState();
                    return;
                }
                const note =
                    kind === 'connectors'
                        ? ' It is disconnected and removed from all vehicles.'
                        : ' Its simulation is stopped.';
                const name = savedItem(kind, item).name;
                if (!confirm(`Delete ${LABEL[kind]} "${name}"?${note}`)) return;
                return applyChange(item, async () => {
                    const result = await sendConfig('DELETE', kind, key);
                    if (result.stored) {
                        remove();
                        if (kind === 'connectors') removeConnectorReferences(key);
                    }
                    return result;
                });
            }

            function revertItem(kind, item) {
                const copy = structuredClone(savedItem(kind, item));
                storedKeys.set(copy, storedKeys.get(item));
                draft[kind][draft[kind].indexOf(item)] = copy;
                cancelPick();
                renderConfig();
                updateConfigState();
            }

            function fillSimulatorDefaults(v) {
                const b = map.getBounds().pad(-0.3);
                const c = map.getCenter();
                const defaults = {
                    corner1: {latitude: round(b.getSouth()), longitude: round(b.getWest())},
                    corner2: {latitude: round(b.getNorth()), longitude: round(b.getEast())},
                    start: {latitude: round(c.lat), longitude: round(c.lng)},
                    homeLocation: {latitude: round(c.lat), longitude: round(c.lng)},
                    end: {latitude: round(b.getNorth()), longitude: round(b.getEast())},
                };
                for (const field of configMeta.simulatorTypes[v.simulator] ?? []) {
                    if (!isPos(v.data[field])) v.data[field] = defaults[field];
                }
            }

            const options = (values, selected) => {
                const list = values.includes(selected) || selected == null ? values : [selected, ...values];
                return list.map((o) => `<option ${o === selected ? 'selected' : ''}>${esc(o)}</option>`).join('');
            };
            const numValue = (n) => (Number.isFinite(n) ? n : '');
            const speedLabel = (speed) =>
                `Speed (m/s)${Number.isFinite(speed) ? ` · ${Math.round(speed * 3.6)} km/h` : ''}`;

            function renderCardFooter(kind, item) {
                const i = draft[kind].indexOf(item);
                const isNew = !storedKeys.has(item);
                const disabled = saving ? 'disabled' : '';
                const actions = isChanged(kind, item)
                    ? `<div class="card-actions"><span>${isNew ? 'Not saved yet' : 'Unsaved changes'}</span>
                        ${isNew ? '' : `<button class="btn" data-action="revert" data-kind="${kind}" data-index="${i}" ${disabled}>Revert</button>`}
                        <button class="btn primary" data-action="save" data-kind="${kind}" data-index="${i}" ${disabled}>Save &amp; apply</button></div>`
                    : '';
                return errorList(itemErrors.get(item) ?? [], 'card-errors') + actions;
            }

            function renderConnector(c, i) {
                const fields = configMeta.connectorTypes[c.connector] ?? [];
                const typeOptions = options(Object.keys(configMeta.connectorTypes), c.connector);
                return `<div class="card" data-kind="connectors" data-index="${i}">
                    <div class="row">
                        <label class="field grow" title="${c.id ? `ID ${esc(c.id)}` : 'Gets an ID when saved'}"><span>Name</span>
                            <input data-path="connectors.${i}.name" value="${esc(c.name ?? '')}"></label>
                        <label class="field grow"><span>Type</span>
                            <select data-path="connectors.${i}.connector" data-rerender>${typeOptions}</select></label>
                        <button class="icon" data-action="delete" data-kind="connectors" data-index="${i}" title="Delete connector"
                            ${saving ? 'disabled' : ''}>×</button>
                    </div>
                    ${fields
                        .map(
                            (f) => `<label class="field"><span>${esc(FIELD_LABELS[f] ?? f)}</span>
                                <input ${f === 'token' ? 'type="password" autocomplete="off"' : ''}
                                    data-path="connectors.${i}.data.${f}" value="${esc(c.data?.[f] ?? '')}"></label>`,
                        )
                        .join('')}
                    <div class="card-footer">${renderCardFooter('connectors', c)}</div>
                </div>`;
            }

            function renderVehicle(v, i) {
                const coords = configMeta.simulatorTypes[v.simulator] ?? [];
                // Only stored connectors can be referenced; the server rejects the others.
                const stored = saved.connectors;
                const simulatorOptions = options(Object.keys(configMeta.simulatorTypes), v.simulator);
                const movementOptions = options(MOVEMENT_TYPES, v.data?.movementType ?? 'driving');
                const coordRows = coords
                    .map((f) => {
                        const p = v.data?.[f] ?? {};
                        const active = pickTarget && pickTarget.index === i && pickTarget.field === f;
                        return `<div class="coord"><span>${esc(COORD_LABELS[f] ?? f)}</span>
                            <input type="number" step="any" placeholder="Latitude" data-coord data-kind="number"
                                data-path="vehicles.${i}.data.${f}.latitude" value="${numValue(p.latitude)}">
                            <input type="number" step="any" placeholder="Longitude" data-coord data-kind="number"
                                data-path="vehicles.${i}.data.${f}.longitude" value="${numValue(p.longitude)}">
                            <button class="icon ${active ? 'active' : ''}" data-action="pick" data-index="${i}"
                                data-field="${f}" title="Pick on map">⌖</button></div>`;
                    })
                    .join('');
                const connectorChecks = stored.length
                    ? stored
                          .map(
                              (c) => `<label><input type="checkbox" data-vehicle-connector="${i}" value="${esc(c.id)}"
                                  ${v.connectors?.includes(c.id) ? 'checked' : ''}> ${esc(c.name)}</label>`,
                          )
                          .join('')
                    : '<span style="color: var(--muted)">No connectors defined</span>';
                return `<div class="card ${v.enabled ? '' : 'disabled'}" data-kind="vehicles" data-index="${i}"
                    style="--card-color: ${cardColor(i)}">
                    <div class="row">
                        <label class="field" title="Enabled"><span>On</span>
                            <input type="checkbox" data-path="vehicles.${i}.enabled" data-kind="bool" ${v.enabled ? 'checked' : ''}></label>
                        <label class="field grow"><span>Name</span>
                            <input data-path="vehicles.${i}.name" value="${esc(v.name ?? '')}"></label>
                        <button class="icon" data-action="delete" data-kind="vehicles" data-index="${i}" title="Delete vehicle"
                            ${saving ? 'disabled' : ''}>×</button>
                    </div>
                    <label class="field"><span>Simulator</span>
                        <select data-path="vehicles.${i}.simulator" data-rerender>${simulatorOptions}</select></label>
                    <div class="row">
                        <label class="field grow"><span>${speedLabel(v.data?.speed)}</span>
                            <input type="number" min="0" step="any" data-path="vehicles.${i}.data.speed" data-kind="number"
                                data-speed value="${numValue(v.data?.speed)}"></label>
                        <label class="field grow"><span>Movement</span>
                            <select data-path="vehicles.${i}.data.movementType">${movementOptions}</select></label>
                    </div>
                    ${coordRows}
                    <label class="field"><span>Unit ID${storedKeys.has(v) ? '' : ' (UUID, empty: generated when saved)'}</span>
                        <input data-path="vehicles.${i}.id" data-kind="optional" value="${esc(v.id ?? '')}"
                            ${storedKeys.has(v) ? 'readonly' : ''}></label>
                    <div class="field"><span>Connectors</span><div class="checks">${connectorChecks}</div></div>
                    <div class="card-footer">${renderCardFooter('vehicles', v)}</div>
                </div>`;
            }

            function renderConfig() {
                if (!draft || !configMeta) return;
                const form = $('config-form');
                const scroll = form.scrollTop;
                form.innerHTML = `
                    <div class="section-title" style="padding-left: 0">Connectors</div>
                    ${draft.connectors.map(renderConnector).join('')}
                    <button class="btn add" data-action="add-connector">+ Add connector</button>
                    <div class="section-title" style="padding-left: 0; margin-top: 12px">Vehicles</div>
                    ${draft.vehicles.map(renderVehicle).join('')}
                    <button class="btn add" data-action="add-vehicle">+ Add vehicle</button>`;
                form.scrollTop = scroll;
                drawConfigOverlay();
            }

            function drawConfigOverlay() {
                configLayer.clearLayers();
                if (view !== 'config' || !draft) return;
                draft.vehicles.forEach((v, i) => {
                    const color = cardColor(i);
                    const d = v.data ?? {};
                    const fields = configMeta.simulatorTypes[v.simulator] ?? [];
                    if (fields.includes('corner1') && isPos(d.corner1) && isPos(d.corner2)) {
                        const bounds = [
                            [d.corner1.latitude, d.corner1.longitude],
                            [d.corner2.latitude, d.corner2.longitude],
                        ];
                        L.rectangle(bounds, {
                            color,
                            weight: 2,
                            dashArray: '6 4',
                            fillOpacity: 0.05,
                            interactive: false,
                        }).addTo(configLayer);
                    }
                    for (const f of fields) {
                        if (!isPos(d[f])) continue;
                        L.circleMarker([d[f].latitude, d[f].longitude], {
                            radius: 6,
                            color: '#fff',
                            weight: 2,
                            fillColor: color,
                            fillOpacity: 1,
                        })
                            .bindTooltip(`${esc(v.name ?? '')}: ${esc(COORD_LABELS[f] ?? f)}`)
                            .addTo(configLayer);
                    }
                });
            }

            /** Re-renders the save controls of the card containing `el`, without touching the focused input. */
            function updateCardFooter(el) {
                const card = el.closest('.card');
                const kind = card.dataset.kind;
                card.querySelector('.card-footer').innerHTML = renderCardFooter(
                    kind,
                    draft[kind][Number(card.dataset.index)],
                );
                updateConfigState();
            }
            $('config-form').addEventListener('input', (e) => {
                const el = e.target;
                if (!el.dataset.path) return;
                let value = el.value;
                if (el.dataset.kind === 'bool') value = el.checked;
                else if (el.dataset.kind === 'number') value = el.value === '' ? null : Number(el.value);
                else if (el.dataset.kind === 'optional') value = el.value.trim() || undefined;
                setPath(draft, el.dataset.path, value);
                updateCardFooter(el);
                if (el.dataset.kind === 'bool') el.closest('.card').classList.toggle('disabled', !value);
                if (el.dataset.speed != null) el.previousElementSibling.textContent = speedLabel(value);
                if (el.dataset.coord != null || el.dataset.path.endsWith('.name')) drawConfigOverlay();
            });
            $('config-form').addEventListener('change', (e) => {
                const el = e.target;
                if (el.dataset.vehicleConnector != null) {
                    const v = draft.vehicles[Number(el.dataset.vehicleConnector)];
                    v.connectors = el.checked
                        ? [...v.connectors, el.value]
                        : v.connectors.filter((c) => c !== el.value);
                    updateCardFooter(el);
                    return;
                }
                if (el.dataset.rerender == null) return;
                const [kind, index] = el.dataset.path.split('.');
                const item = draft[kind][Number(index)];
                if (kind === 'vehicles') {
                    fillSimulatorDefaults(item);
                } else {
                    // Keep only the fields the new connector type uses.
                    const fields = configMeta.connectorTypes[item.connector] ?? [];
                    item.data = Object.fromEntries(fields.map((f) => [f, item.data?.[f] ?? '']));
                }
                renderConfig();
                updateConfigState();
            });
            $('config-form').addEventListener('click', (e) => {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const i = Number(btn.dataset.index);
                const item = btn.dataset.kind && draft[btn.dataset.kind][i];
                switch (btn.dataset.action) {
                    case 'save':
                        saveItem(btn.dataset.kind, item);
                        return;
                    case 'revert':
                        revertItem(btn.dataset.kind, item);
                        return;
                    case 'delete':
                        deleteItem(btn.dataset.kind, item);
                        return;
                    case 'add-connector': {
                        const type = Object.keys(configMeta.connectorTypes)[0];
                        draft.connectors.push({
                            name: `connector-${draft.connectors.length + 1}`,
                            connector: type,
                            data: Object.fromEntries(configMeta.connectorTypes[type].map((f) => [f, ''])),
                        });
                        break;
                    }
                    case 'add-vehicle': {
                        const v = {
                            name: `Vehicle ${draft.vehicles.length + 1}`,
                            enabled: true,
                            simulator: 'RandomRouteSimulator',
                            data: {speed: 14, movementType: 'driving'},
                            connectors: [],
                        };
                        fillSimulatorDefaults(v);
                        draft.vehicles.push(v);
                        break;
                    }
                    case 'pick': {
                        const same = pickTarget && pickTarget.index === i && pickTarget.field === btn.dataset.field;
                        pickTarget = same ? null : {index: i, field: btn.dataset.field};
                        $('map').classList.toggle('picking', !!pickTarget);
                        renderConfig();
                        updateConfigState();
                        return;
                    }
                }
                pickTarget = null;
                $('map').classList.remove('picking');
                renderConfig();
                updateConfigState();
            });

            function cancelPick() {
                if (!pickTarget) return;
                pickTarget = null;
                $('map').classList.remove('picking');
                renderConfig();
                updateConfigState();
            }
            map.on('click', (e) => {
                if (!pickTarget) return;
                const v = draft.vehicles[pickTarget.index];
                v.data[pickTarget.field] = {latitude: round(e.latlng.lat), longitude: round(e.latlng.lng)};
                pickTarget = null;
                $('map').classList.remove('picking');
                renderConfig();
                updateConfigState();
            });
            document.addEventListener('keydown', (e) => e.key === 'Escape' && cancelPick());

            $('config-discard').addEventListener('click', () => {
                showConfigErrors([]);
                cancelPick();
                loadConfig();
            });
            window.addEventListener('beforeunload', (e) => {
                if (unsavedCount()) e.preventDefault();
            });

            function setView(next) {
                view = next;
                window.history.replaceState(null, '', next === 'config' ? '#config' : location.pathname);
                $('live-view').hidden = next !== 'live';
                $('config-view').hidden = next !== 'config';
                for (const b of document.querySelectorAll('.views button')) {
                    b.classList.toggle('active', b.dataset.view === next);
                }
                if (next === 'config') {
                    configLayer.addTo(map);
                    if (!draft) loadConfig();
                    else renderConfig();
                } else {
                    cancelPick();
                    configLayer.remove();
                }
            }
            document.querySelector('.views').addEventListener('click', (e) => {
                const b = e.target.closest('button[data-view]');
                if (b) setView(b.dataset.view);
            });

            connect();
            if (location.hash === '#config') setView('config');
            setInterval(() => selectedId && activeTab === 'status' && renderDetail(), 5000);
        </script>
    </body>
</html>
